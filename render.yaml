services:
  - type: web
    name: monetrax
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: flask --app app init-db && gunicorn "app:create_app()" --workers 2 --timeout 60
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: SECRET_KEY
        generateValue: true
      - key: SECURE_COOKIES
        value: "true"
      - key: TRUST_PROXY
        value: "1"
      - key: APP_TIMEZONE
        value: Asia/Manila
      - key: MONETRAX_REQUIRE_SCHOOL_EMAIL
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: monetrax-db
          property: connectionString

databases:
  - name: monetrax-db
    plan: free
